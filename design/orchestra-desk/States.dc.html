<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mascot roles and states</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif}
.mascot .legB{opacity:0}
.mascot.running .legA{animation:legA .5s steps(1) infinite}
.mascot.running .legB{animation:legB .5s steps(1) infinite}
.mascot.running .bob{animation:bob .5s steps(1) infinite}
.mascot.running .eye{animation:blink 3.2s infinite;transform-box:fill-box;transform-origin:center}
.mascot.queued .zz{animation:zz 1.6s steps(1) infinite}
.mascot.failed .bob{animation:shake .4s steps(1) 3}
@keyframes legA{0%{opacity:1}50%{opacity:0}}
@keyframes legB{0%{opacity:0}50%{opacity:1}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes zz{0%{opacity:1}50%{opacity:.25}}
@keyframes shake{0%{transform:translateX(0)}50%{transform:translateX(-1px)}}
</style>
</helmet>
<div style="width: 760px; height: 620px; box-sizing: border-box; padding: 28px 32px; background: #1a1918; color: #faf9f5; display: flex; flex-direction: column; gap: 18px">
<div style="font-size: 20px; font-weight: 700">Agent mascots: roles and states</div>
<div style="display: grid; grid-template-columns: 140px repeat(4, minmax(0, 1fr)); gap: 12px; align-items: center">
<div></div>
<div style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #d97757; text-align: center">Working</div>
<div style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #d97757; text-align: center">Queued</div>
<div style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #d97757; text-align: center">Done</div>
<div style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #d97757; text-align: center">Failed</div>
<div style="font-size: 13px; font-weight: 600; color: #d6d4cb">Main agent</div>
