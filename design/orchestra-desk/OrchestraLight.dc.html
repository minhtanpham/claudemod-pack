<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orchestra Desk, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.mascot .legB{opacity:0}
.mascot.running .legA{animation:legA .5s steps(1) infinite}
.mascot.running .legB{animation:legB .5s steps(1) infinite}
.mascot.running .bob{animation:bob .5s steps(1) infinite}
.mascot.running .eye{animation:blink 3.2s infinite;transform-box:fill-box;transform-origin:center}
.mascot.queued .zz{animation:zz 1.6s steps(1) infinite}
@keyframes legA{0%{opacity:1}50%{opacity:0}}
@keyframes legB{0%{opacity:0}50%{opacity:1}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes zz{0%{opacity:1}50%{opacity:.25}}
.stripe{background-size:22px 22px;animation:stripes .9s linear infinite}
@keyframes stripes{to{background-position:22px 0}}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.band{animation:slideUp .5s ease-out both}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.card{animation:cardIn .45s ease-out both}
@keyframes cardIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
.card.run{animation:cardIn .45s ease-out both,glow 2s ease-in-out infinite .5s}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 0%,transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}}
.live{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.indet-unused{position:absolute;left:0;top:0;height:100%;width:35%;background:var(--acc);border-radius:2px;animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{left:-35%}100%{left:100%}}
.cursor{animation:pulse 1s steps(1) infinite}
</style>
</helmet>
<dc-import name="Artboard-ax7a" theme="light" hint-size="1440px,860px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
