<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Model Router, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.mascot .legB{opacity:0}
.mascot.running .legA{animation:legA .5s steps(1) infinite}
.mascot.running .legB{animation:legB .5s steps(1) infinite}
.mascot.running .bob{animation:bob .5s steps(1) infinite}
.mascot.running .eye{animation:blink 3.2s infinite;transform-box:fill-box;transform-origin:center}
.mascot.queued .zz{animation:zz 1.6s steps(1) infinite}
.mascot.failed .bob{animation:shake .4s steps(1) 3}
@keyframes legA{0%{opacity:1}50%{opacity:0}}
@keyframes legB{0%{opacity:0}50%{opacity:1}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes zz{0%{opacity:1}50%{opacity:.25}}
@keyframes shake{0%{transform:translateX(0)}50%{transform:translateX(-1px)}}
.chipIn{animation:chipIn .35s ease-out both}
@keyframes chipIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.shimmer{background:linear-gradient(90deg,var(--track) 0%,var(--ring) 50%,var(--track) 100%);background-size:200% 100%;animation:shim 1.1s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.dots span{display:inline-block;animation:dot 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}
.live{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.warnRow{animation:warn 1.6s ease-in-out infinite}
@keyframes warn{0%,100%{box-shadow:0 0 0 0 rgba(217,119,87,0)}50%{box-shadow:0 0 0 3px rgba(217,119,87,.28)}}
.dialog{animation:dialogIn .3s ease-out both}
@keyframes dialogIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.panel{animation:slideUp .45s ease-out both}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pip{transition:background-color .3s,transform .3s}
.pip.on{animation:pipIn .35s ease-out}
@keyframes pipIn{0%{transform:scale(.5)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
</style>
</helmet>
<dc-import name="ModelRouter" theme="light" hint-size="1200px,640px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":640}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
